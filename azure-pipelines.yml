trigger:
  - main

pool:
  vmImage: ubuntu-latest

steps:
- task: Docker@2
  displayName: Build and push backend
  inputs:
    command: buildAndPush
    containerRegistry: dockerhub-connection
    repository: amruthaumashanker/ecommerce-backend
    dockerfile: node-ecommerce/Dockerfile
    buildContext: node-ecommerce
    tags: |
      $(Build.BuildId)
      latest

- task: Docker@2
  displayName: Build and push frontend
  inputs:
    command: buildAndPush
    containerRegistry: dockerhub-connection
    repository: amruthaumashanker/ecommerce-frontend
    dockerfile: react-ecommerce/Dockerfile
    buildContext: react-ecommerce
    tags: |
      $(Build.BuildId)
      latest