trigger:
  - main

stages:
- stage: Build
  displayName: Build and push images
  jobs:
  - job: BuildPush
    pool:
      vmImage: ubuntu-24.04
    steps:
    - task: Docker@2
      displayName: Build and push backend
      inputs:
        command: buildAndPush
        containerRegistry: dockerhub-connection
        repository: amruthaumashanker/ecommerce-backend
        dockerfile: node-ecommerce/Dockerfile
        buildContext: node-ecommerce
        tags: |
          $(Build.BuildId)
          latest

    - task: Docker@2
      displayName: Build and push frontend
      inputs:
        command: buildAndPush
        containerRegistry: dockerhub-connection
        repository: amruthaumashanker/ecommerce-frontend
        dockerfile: react-ecommerce/Dockerfile
        buildContext: react-ecommerce
        tags: |
          $(Build.BuildId)
          latest

- stage: Deploy
  displayName: Deploy to laptop
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployLaptop
    timeoutInMinutes: 15
    pool:
      name: Default
      demands:
        - Agent.Name -equals laptop-agent
    steps:
    - checkout: self

    - task: PowerShell@2
      displayName: Pull new images and restart
      env:
        TAG: $(Build.BuildId)
      inputs:
        targetType: inline
        script: |
          docker compose -p ecommerce-prod -f docker-compose.prod.yml pull
          docker compose -p ecommerce-prod -f docker-compose.prod.yml up -d
          docker compose -p ecommerce-prod -f docker-compose.prod.yml ps

    - task: PowerShell@2
      displayName: Health check
      inputs:
        targetType: inline
        script: |
          for ($i = 0; $i -lt 40; $i++) {
            try {
              $r = Invoke-WebRequest http://localhost/api/products -UseBasicParsing
              if ($r.StatusCode -ge 200 -and $r.StatusCode -lt 300) { Write-Host "App is up"; exit 0 }
            } catch {}
            Start-Sleep -Seconds 4
          }
          Write-Error "App did not become healthy"
          exit 1