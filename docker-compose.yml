services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./node-ecommerce
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongo:27017/eccomerce
    depends_on:
      - mongo

  frontend:
    build: ./react-ecommerce
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data: